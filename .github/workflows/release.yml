name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  zip:
    name: Release-ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: pdo_mysql, sodium, gd, intl, curl, mbstring, gmp

      - name: Abhängigkeiten für das Release installieren
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Abhängigkeiten prüfen
        run: composer audit

      - name: ZIP bauen
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Der Tagname eignet sich nicht als Dateiname."
            exit 1
          fi
          name="personal-hub-${tag}"
          mkdir -p "build/${name}"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            --exclude '/docs/' \
            --exclude '/README.md' \
            --exclude '/CHANGELOG.md' \
            --exclude 'tests/' \
            --exclude 'build/' \
            --exclude 'phpunit.xml' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'phpstan.neon' \
            --exclude '.php-cs-fixer.dist.php' \
            --exclude '.php-cs-fixer.cache' \
            --exclude '.phpunit.cache/' \
            --exclude 'config/config.php' \
            --exclude 'config/keys/***' \
            --exclude 'storage/***' \
            ./ "build/${name}/"
          mkdir -p "build/${name}/config/keys"
          touch "build/${name}/config/keys/.gitkeep"
          for dir in logs cache sessions uploads; do
            mkdir -p "build/${name}/storage/${dir}"
            touch "build/${name}/storage/${dir}/.gitkeep"
          done
          (
            cd build
            zip -r -X "../${name}.zip" "${name}"
          )
          test -f "${name}.zip"

      - name: ZIP an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="personal-hub-${GITHUB_REF_NAME}.zip"
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "${GITHUB_REF_NAME}" "$file" --clobber; then
              exit 0
            fi
            echo "Release noch nicht erreichbar, Versuch ${attempt}."
            sleep 10
          done
          exit 1
