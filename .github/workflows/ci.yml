name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: personal_hub_test
          MARIADB_USER: ph
          MARIADB_PASSWORD: ph
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PH_TEST_DB_HOST: 127.0.0.1
    steps:
      - name: Quelltext holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP ${{ matrix.php }} einrichten
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql, sodium, gd, intl, curl, mbstring, gmp

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist

      - name: Abhängigkeiten prüfen
        run: composer audit

      - name: Code-Stil
        run: composer cs

      - name: Tests
        run: composer test

      - name: Statische Analyse
        run: |
          if find src tests -name '*.php' -print -quit | grep -q .; then
            composer stan
          else
            echo "Keine PHP-Dateien in src/ oder tests/, PHPStan übersprungen."
          fi

  release:
    name: Release-ZIP
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quelltext holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: pdo_mysql, sodium, gd, intl, curl, mbstring, gmp

      - name: Abhängigkeiten für das Release installieren
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Abhängigkeiten prüfen
        run: composer audit

      - name: ZIP bauen
        run: |
          set -euo pipefail
          printf '%s\n' 'Require all denied' > vendor/.htaccess
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Der Tagname eignet sich nicht als Dateiname."
            exit 1
          fi
          name="personal-hub-${tag}"
          mkdir -p "build/${name}"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            --exclude '/docs/' \
            --exclude '/README.md' \
            --exclude '/CHANGELOG.md' \
            --exclude 'tests/' \
            --exclude 'build/' \
            --exclude 'phpunit.xml' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'phpstan.neon' \
            --exclude '.php-cs-fixer.dist.php' \
            --exclude '.php-cs-fixer.cache' \
            --exclude '.phpunit.cache/' \
            --exclude 'config/config.php' \
            --exclude 'config/keys/***' \
            --exclude 'storage/***' \
            ./ "build/${name}/"
          mkdir -p "build/${name}/config/keys"
          touch "build/${name}/config/keys/.gitkeep"
          for dir in logs cache sessions uploads; do
            mkdir -p "build/${name}/storage/${dir}"
            touch "build/${name}/storage/${dir}/.gitkeep"
          done
          cp storage/.htaccess "build/${name}/storage/.htaccess"
          (
            cd build
            zip -r -X "../${name}.zip" "${name}"
          )
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          test -f "${name}.zip"
          test -f "${name}.zip.sha256"

      - name: ZIP bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-zip
          if-no-files-found: error
          path: |
            personal-hub-${{ github.ref_name }}.zip
            personal-hub-${{ github.ref_name }}.zip.sha256

  publish:
    name: Release hochladen
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ZIP holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-zip
          path: dist

      - name: ZIP an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="dist/personal-hub-${GITHUB_REF_NAME}.zip"
          sum="${file}.sha256"
          test -f "$file"
          test -f "$sum"
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "${GITHUB_REF_NAME}" "$file" "$sum" --clobber; then
              exit 0
            fi
            echo "Release noch nicht erreichbar, Versuch ${attempt}."
            sleep 10
          done
          exit 1
